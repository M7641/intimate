# Vendored proto plugin for Vale (errata-ai/vale) — the prose linter. Authored
# here per our "vendored thin pointer" policy; points at OFFICIAL releases.
#
# Vale's asset naming needs remapping:
#   - OS is capitalised (`Linux`, `macOS`) → hardcoded per platform section.
#   - arch is `64-bit` / `arm64` (not proto's `x86_64` / `aarch64`) → [install.arch].
#   - tags are `vX.Y.Z` but the asset filename uses the bare version → `v{version}`
#     is literal in the URL while {version} stays bare.
name = "vale"
type = "cli"

[resolve]
git-url = "https://github.com/errata-ai/vale"

[platform.linux]
download-file = "vale_{version}_Linux_{arch}.tar.gz"
checksum-file = "vale_{version}_checksums.txt"

[platform.macos]
download-file = "vale_{version}_macOS_{arch}.tar.gz"
checksum-file = "vale_{version}_checksums.txt"

[platform.windows]
download-file = "vale_{version}_Windows_{arch}.zip"
checksum-file = "vale_{version}_checksums.txt"

[install]
download-url = "https://github.com/errata-ai/vale/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/errata-ai/vale/releases/download/v{version}/{checksum_file}"

# The tarball holds `vale` at the root (alongside LICENSE/README).
[install.exes.vale]
exe-path = "vale"
primary = true

[install.arch]
aarch64 = "arm64"
x86_64 = "64-bit"
