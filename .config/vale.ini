# Vale config — the prose linter pinned in .prototools. Checks spelling and
# house style in Markdown.
#
# Vale auto-discovers only .vale.ini / _vale.ini in the working dir and its
# ancestors — NOT .config/ — so every invocation must pass --config explicitly,
# same as gitleaks, cargo-deny and sqruff:
#
#   vale --config .config/vale.ini README.md
#   git ls-files -z '*.md' | xargs -0 vale --config .config/vale.ini
#
# Paths below are relative to THIS file, so StylesPath resolves to
# .config/vale/styles.

StylesPath = vale/styles

# Project vocabulary: .config/vale/styles/config/vocabularies/House/accept.txt.
# Add a term there rather than sprinkling <!-- vale off --> through the docs.
Vocab = House

# error blocks (see the pre-commit hook); warning is advisory; suggestion is
# hidden unless you ask for it: --minAlertLevel=suggestion.
MinAlertLevel = warning

# Everything in this repo is prose-in-Markdown. Code blocks and inline code are
# skipped by Vale's Markdown parser, so identifiers never reach the spell check.
[*.md]
BasedOnStyles = Vale, House

# Vale.Terms enforces the capitalisation of every Vocab entry. Useful, but it
# fires on the many project names that are lowercase by design (moon, proto,
# cocoon, rose), so the vocabulary carries the exact spelling and this stays off.
Vale.Terms = NO

# — Exceptions —

# French prose. The repo standard is English (see .claude/CLAUDE.md); these
# predate it. Checked against an English dictionary, every line is an alert, so
# spelling is off for them — the House rules still apply. Detected with a
# stopword-density scan; re-run it if you add prose in another language.
[humanities/languages/**]
Vale.Spelling = NO
# "nous nous", "то... то..." — grammar drills, not accidental repetition.
Vale.Repetition = NO

# Matched by filename, not path — these two move around the notes tree.
[**/{Database Dx,Ménagerie}.md]
Vale.Spelling = NO

[{blank/mana/docs/mimic/feedback,cocoon/crates/ouroboros/README,rose/galicia-rs/README,rose/galicia-rs/galicia-py/README,rose/perch/README,workspaces/future/VISION}.md]
Vale.Spelling = NO

# Vendored scaffolding templates — not ours to restyle.
[{blank/inertia/src/inertia/templs,cocoon/apps/nyx/templates}/**]
Vale.Spelling = NO
