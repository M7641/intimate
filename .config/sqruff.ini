# sqruff config (the SQL linter/formatter pinned in .prototools). OPT-IN only —
# not wired into the git hooks: the analytics queries mix Postgres with two
# templating styles (`%(name)s` psycopg params and `{schema}` python .format),
# which strict parsing trips over. Tuned here as a best-effort starting point.
#
# sqruff auto-discovers only .sqlfluff / .sqruff / .sqruff.ini / sqruff.toml in
# the working dir and its ancestors — NOT .config/ — so every invocation must
# pass --config explicitly:
#   sqruff lint --config .config/sqruff.ini rose/rust_hold
# The .claude/hooks/lint.sh PostToolUse hook already does this for *.sql edits.
#
# Section names: sqruff accepts both the [sqlfluff…] and [sqruff…] prefixes.
# Using the native [sqruff…] one here since sqlfluff itself is no longer a
# pinned tool in this repo.
[sqruff]
dialect = postgres
templater = placeholder
# Keep the output focused on layout/style rather than deep semantic rules.
max_line_length = 120
exclude_rules = L044, AM04

[sqruff:templater:placeholder]
# Handles the psycopg `%(name)s` parameter style. The `{schema}` python-format
# placeholders are pre-substituted below so the query parses.
param_style = pyformat
schema = analytics

[sqruff:indentation]
indent_unit = space
tab_space_size = 4
