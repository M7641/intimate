[package]
name = "restate_pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
restate-sdk = { version = "0.9", features = ["http_server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
