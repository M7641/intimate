[package]
name = "nameless"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "fs", "time"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# TUI
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.28"

# LLM (Anthropic API)
rig-core = { version = "0.32", features = ["derive"] }

# Local inference
candle-core = "0.9"
candle-transformers = "0.9"
reqwest = { version = "0.12", features = ["blocking"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"
async-trait = "0.1"

# Utilities
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[features]
metal = ["candle-core/metal", "candle-transformers/metal"]
