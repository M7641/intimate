[package]
name = "forage"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "sync", "signal"] }
futures = "0.3"

# Drive Chrome over the DevTools Protocol (0.9 is tokio-based)
chromiumoxide = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization — the report bundle is JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# URL parsing — same-origin checks, route keys, slugs
url = "2"

# Time — run ids + durations
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Decode base64-encoded response bodies from Network.getResponseBody
base64 = "0.22"

# Safe HTML report rendering
html-escape = "0.2"

# URL include/exclude filters + destructive-keyword matching
regex = "1"

# Error handling
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
