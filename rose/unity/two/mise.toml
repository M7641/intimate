[tools]
rust = { version = "1.94.1", targets = "wasm32-unknown-unknown" }
# The wasm-bindgen CLI version MUST match the wasm-bindgen crate version in
# Cargo.lock, otherwise the build fails with a schema-mismatch error.
"ubi:rustwasm/wasm-bindgen" = { version = "0.2.122", extract_all = "true" }
"ubi:WebAssembly/binaryen" = { version = "version_123", extract_all = "true", bin_path = "bin" }

[tasks.build]
description = "Compile the crate to WASM and emit the JS glue into ../public/wasm"
run = [
    "cargo build --release --target wasm32-unknown-unknown",
    "wasm-bindgen --target web ./target/wasm32-unknown-unknown/release/suffering.wasm --out-dir ../public/wasm",
    "wasm-opt -Oz ../public/wasm/suffering_bg.wasm -o ../public/wasm/suffering_bg.wasm",
]
