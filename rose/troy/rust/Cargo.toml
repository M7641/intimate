[package]
name = "troy-internal"
version = "0.1.0"
edition = "2021"
description = "Internal binary boundary — Protobuf types generated from the registry"

# Empty [workspace] makes this crate its own root so it is not absorbed by any
# parent Cargo workspace in the monorepo.
[workspace]

[dependencies]
prost = "0.13"

[build-dependencies]
prost-build = "0.13"
# protox is a pure-Rust protobuf compiler — it replaces the system `protoc`,
# so the .proto compiles with no external toolchain installed.
protox = "0.7"
