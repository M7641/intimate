[project]
name = "galicia"
version = "0.0.1"
description = "PoC: DuckDB + Iceberg sur 'S3' local — une alternative low-cost à Redshift"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.0",
  "pyiceberg[pyarrow]>=0.8.0",
  "pyarrow>=17.0.0",
  "sqlalchemy>=2.0",
  "typer>=0.12",
]

[project.scripts]
galicia = "galicia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["galicia"]
