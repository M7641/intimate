[package]
name = "moss"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "math_server"
path = "src/bin/math_server.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
