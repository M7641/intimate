[project]
name = "nix-stack"
version = "0.1.0"
description = "CLI orchestrator for the Nix-reproducible multi-language stack"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0",
]

[project.scripts]
nix-stack = "nix_stack.cli:app"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
