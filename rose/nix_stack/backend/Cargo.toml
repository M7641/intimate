[package]
name = "nix-stack-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Container integration test (tests/image_it.rs): drive the built production
# image over HTTP, torn down on drop. reqwest is the in-test HTTP client.
testcontainers = "0.24"
reqwest = { version = "0.12", default-features = false }
