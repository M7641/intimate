[project]
name = "saga"
version = "0.1.0"
description = "Le noyau mécanique d'une context database pour agents IA — mémoire épisodique + sémantique, récupération hybride, invalidation bi-temporelle. Hors-ligne, sans dépendance lourde."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0",
]

[project.scripts]
saga = "saga.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saga"]
