[package]
name = "levers-backend"
version = "0.1.0"
edition = "2024"
publish = false
description = "Greenfield levers backend (Axum) — successor to the FastAPI app at modules/planner/levers/backend/api.py."

[[bin]]
name = "levers-backend"
path = "src/main.rs"

[dependencies]
common_rs = { path = "../../../../src/common_rs" }

axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["query"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "fs"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "macros"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"

thiserror = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
