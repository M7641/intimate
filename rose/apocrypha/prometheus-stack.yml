# Prometheus config for the local docker-compose stack.
# Scrapes the OTel Collector's prometheus exporter + backend health metrics.
# The original prometheus/prometheus.yml targets the deployed platform service.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    scrape_interval: 5s
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
    metrics_path: /metrics

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
    metrics_path: /metrics

  - job_name: "pyroscope"
    static_configs:
      - targets: ["pyroscope:4040"]
    metrics_path: /metrics
