[project]
name = "quartz"
version = "0.1.0"
description = "A SolidJS + shadcn-solid + TanStack Solid Router pilot served in production by FastAPI."
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
requires-python = ">=3.12"
dependencies = [
    "pure @ git+https://github.com/nimbus-labs/nimbus-monorepo.git@main#subdirectory=blank/pure",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "typer>=0.16.0",
    "joblib>=1.5.1",
    "pydantic>=2.11.7",
    "pyinstrument>=5.1.1",
    "orjson>=3.11.2",
    "uvloop>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "apscheduler>=3.11.0",
    "httptools>=0.7.1",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[project.scripts]
"quartz" = "quartz.cli:app"

[tool.pytest_env]
TARGET_ENV = {value = "dev", transform = true}

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
