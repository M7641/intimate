[package]
name = "gauge-axum-example"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Optional heap profiler — the Rust counterpart to memray/tracemalloc. Behind a
# feature so the normal image carries none of its overhead.
dhat = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]

[profile.release]
# Line tables so dhat's allocation backtraces resolve to source. Costs binary
# size, not runtime memory.
debug = 1
