# Workspace-wide cargo aliases. Config is discovered by walking up from the
# invocation directory, so these work anywhere inside `cocoon/`.
#
# (The `cv` alias lived here until the CV moved out to `../cv` as a standalone
# Typst document — it is built with `typst compile`, not cargo.)

[alias]
# `cargo parle` — run the language app with CUDA inference for the story page.
# Needs nvcc on PATH at build time; use `cargo run -p parle` for a CPU build.
parle = "run -p parle --features cuda"
