[package]
name = "blobs"
version.workspace = true
edition.workspace = true

[lib]
name = "blobs"
path = "src/lib.rs"

[features]
default = ["s3", "local"]
s3 = ["aws-config", "aws-sdk-s3"]
local = ["mime_guess"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "fs"] }

# S3 dependencies (optional)
aws-config = { version = "1.8.12", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3 = { version = "1.119", optional = true }

# Local filesystem dependencies (optional)
mime_guess = { version = "2.0", optional = true }

[lints]
workspace = true
